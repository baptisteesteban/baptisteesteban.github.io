<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baptiste Esteban - Home Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <link href="font-awesome/icons.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">
    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
            <a class="navbar-brand" href="#">Baptiste Esteban</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link" href="#">Home</a>
                    <a class="nav-link" href="#">CV</a>
                    <a class="nav-link" href="#">Research</a>
                    <a class="nav-link" href="#">Teaching</a>
                    <a class="nav-link" href="#">Publications</a>
                </div>
            </div>
        </div>
    </nav>



    <main class="flex-grow-1 mt-4">
        {% block content %} {% endblock content %}
    </main>

    <footer class="bg-body-tertiary text-center py-4 mt-5 border-top">
        <div class="container">
            Built with <a href="https://www.getzola.org/" target="_blank" rel="noopener">Zola</a>
            &amp; <a href="https://getbootstrap.com/" target="_blank" rel="noopener">Bootstrap</a>. Icons are from <a
                href="https://fontawesome.com/" target="_blank" rel="noopener">Font Awesome Free</a>.
        </div>
    </footer>
</body>

</html>
